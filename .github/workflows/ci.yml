name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --frozen

      - name: Lint (pre-commit)
        run: uv run pre-commit run --all-files
        env:
          SKIP: gitleaks

      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check (pyright)
        run: uv run pyright

      - name: Tests
        run: uv run pytest

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t scanner:ci .

      - name: Smoke run
        run: docker run --rm scanner:ci | grep -q "iss_base_url"
