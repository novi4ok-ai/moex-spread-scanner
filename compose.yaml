services:
  scanner:
    build: .
    environment:
      SCANNER_DATABASE_URL: postgresql://scanner:dev@db:5432/scanner
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: scanner
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner -d scanner"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
